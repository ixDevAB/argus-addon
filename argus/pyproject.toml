[project]
name = "argus_addon"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "websockets>=13",
    "aiohttp>=3.9",
    "pydantic>=2",
    "structlog>=24",
    "typing_extensions>=4.12",
    "segno>=1.6,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2",
    "httpx>=0.27",
    "pygments>=2",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["argus_addon*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "argus_addon/static"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
]
ignore = [
    "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

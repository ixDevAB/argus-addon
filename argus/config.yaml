name: "Argus"
version: "1.6.0"
slug: "argus"
description: "Argus home safety add-on. Connects to the Argus cloud over a secure outbound WebSocket."
arch:
  - "aarch64"
  - "amd64"
init: false
ingress: true
ingress_port: 8099
homeassistant_api: true
panel_icon: "mdi:shield-home"
panel_title: "Argus"
map:
  - "data:rw"
# Talk audio is a WebRTC session straight to this add-on's go2rtc, so it needs real host ports
# for ICE rather than the add-on network.
host_network: true
options:
  reolink_host: ""
  reolink_username: ""
  reolink_password: ""
  reolink_use_https: false
  clip_spool_mb: 300
schema:
  reolink_host: "str?"
  reolink_username: "str?"
  reolink_password: "password?"
  reolink_use_https: "bool?"
  clip_spool_mb: "int(50,2000)?"
